  <meta charset="UTF-8" />

  <link href="https://unpkg.com/lucide-static@latest/font/lucide.css" rel="stylesheet">

  <link href="css/theme.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-black py-3">
    <div class="container">
      <a class="navbar-brand fw-bold text-white" href="index.html">
        <img src="images/Faros_Logo.jpeg" alt="Faros Legal">
        <span>Faros Legal</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="practice-areas.html">Practice Areas</a></li>
          <li class="nav-item"><a class="nav-link" href="insights.html">Insights & Highlights</a></li>
          <li class="nav-item"><a class="nav-link active" href="bulletin.html">Bulletin</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="py-5 text-center" style="background: var(--bg-section);">
    <div class="container">
      <h1 class="fw-semibold">Bulletin Detail</h1>
      <p class="text-muted mb-0">Review the full bulletin entry and related resources.</p>
    </div>
  </section>

  <section class="py-5">
    <div class="container">
      <div id="bulletin-status" class="alert alert-info" style="display: none;"></div>
      <div id="bulletin-detail"></div>
    </div>
  </section>

  <footer class="bg-black text-white text-center py-3">
    <small>Ac 2025 Faros Legal | Bengaluru, India</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script>
    const detailEl = document.getElementById('bulletin-detail');
    const statusEl = document.getElementById('bulletin-status');
    const allowedIframeHosts = ['youtube.com', 'www.youtube.com', 'youtu.be', 'vimeo.com', 'player.vimeo.com'];

    function isAllowedEmbed(src) {
      try {
        const url = new URL(src, window.location.href);
        return allowedIframeHosts.some(host => url.hostname === host || url.hostname.endsWith(`.${host}`));
      } catch (err) {
        return false;
      }
    }

    DOMPurify.addHook('uponSanitizeElement', (node, data) => {
      if (data.tagName === 'iframe') {
        const src = node.getAttribute('src') || '';
        if (!isAllowedEmbed(src)) {
          if (node.parentNode) node.parentNode.removeChild(node);
        } else {
          node.setAttribute('referrerpolicy', 'no-referrer');
          node.setAttribute('allowfullscreen', 'true');
        }
      }
    });

    function renderMarkdown(md) {
      return DOMPurify.sanitize(marked.parse(md || ''), {
        ADD_TAGS: ['iframe'],
        ADD_ATTR: ['allow', 'allowfullscreen', 'frameborder', 'src', 'width', 'height', 'referrerpolicy'],
      });
    }

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = `alert alert-${type}`;
      statusEl.style.display = 'block';
    }

    function clearDetail() {
      while (detailEl.firstChild) {
        detailEl.removeChild(detailEl.firstChild);
      }
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      const dd = String(date.getDate()).padStart(2, '0');
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const yyyy = date.getFullYear();
      return `${dd}-${mm}-${yyyy}`;
    }

    function normalizeSlug(value) {
      return (value || '').toString().trim().toLowerCase();
    }

    function getYouTubeId(url) {
      try {
        const parsed = new URL(url);
        let id = null;
        if (parsed.hostname.includes('youtu.be')) {
          id = parsed.pathname.slice(1);
        } else if (parsed.hostname.includes('youtube.com')) {
          if (parsed.pathname === '/watch') {
            id = parsed.searchParams.get('v');
          } else if (parsed.pathname.startsWith('/shorts/')) {
            id = parsed.pathname.split('/')[2];
          } else if (parsed.pathname.startsWith('/embed/')) {
            id = parsed.pathname.split('/')[2];
          }
        }
        if (id && /^[\w-]{6,}$/.test(id)) return id;
      } catch (err) {
        return null;
      }
      return null;
    }

    function getVimeoId(url) {
      try {
        const parsed = new URL(url);
        if (!parsed.hostname.includes('vimeo.com')) return null;
        const match = parsed.pathname.match(/\/(\d+)(?:$|\/)/);
        return match ? match[1] : null;
      } catch (err) {
        return null;
      }
    }

    function getHeroLayoutClass(layout) {
      const allowed = ['full', 'contained', 'left', 'right'];
      const value = allowed.includes(layout) ? layout : 'contained';
      return `layout-${value}`;
    }

    function normalizeGalleryItems(post) {
      if (Array.isArray(post.gallery)) return post.gallery.filter(item => item && (item.image || item.src));
      if (Array.isArray(post.images)) {
        return post.images
          .filter(item => item && (item.src || item.image))
          .map(item => ({
            image: item.image || item.src,
            alt: item.alt || item.caption,
            caption: item.caption,
            layout: item.layout,
          }));
      }
      return [];
    }

    function getGalleryColClass(layout) {
      switch (layout) {
        case 'half':
          return 'col-12 col-md-6';
        case 'third':
          return 'col-12 col-md-4 col-lg-3';
        default:
          return 'col-12';
      }
    }

    function renderNotFound() {
      clearDetail();
      const wrapper = document.createElement('div');
      wrapper.className = 'text-center';
      const title = document.createElement('h3');
      title.className = 'mb-3';
      title.textContent = 'Not found or unpublished';
      const text = document.createElement('p');
      text.className = 'text-muted';
      text.textContent = 'The requested bulletin is unavailable.';
      const link = document.createElement('a');
      link.href = 'bulletin.html';
      link.className = 'btn btn-outline-dark';
      link.textContent = 'Back to Bulletin';
      wrapper.append(title, text, link);
      detailEl.appendChild(wrapper);
    }

    function renderSection(titleText) {
      const section = document.createElement('div');
      section.className = 'mt-4';
      const heading = document.createElement('h4');
      heading.textContent = titleText;
      section.appendChild(heading);
      return section;
    }

    function renderDetail(post) {
      clearDetail();
      statusEl.style.display = 'none';

      const header = document.createElement('div');
      header.className = 'mb-4';

      const title = document.createElement('h2');
      title.className = 'fw-semibold';
      title.textContent = post.title || 'Untitled bulletin';

      const meta = document.createElement('div');
      meta.className = 'bulletin-meta';
      meta.textContent = formatDate(post.date);

      header.append(title, meta);

      if (post.summary) {
        const summary = document.createElement('p');
        summary.className = 'mt-2 text-muted';
        summary.innerHTML = renderMarkdown(post.summary);
        header.appendChild(summary);
      }

      detailEl.appendChild(header);

      if (post.hero && (post.hero.image || post.hero.src)) {
        const heroWrapper = document.createElement('div');
        heroWrapper.className = `bulletin-hero ${getHeroLayoutClass(post.hero.layout)}`;
        const figure = document.createElement('figure');
        figure.className = 'mb-3';
        const img = document.createElement('img');
        img.src = post.hero.image || post.hero.src;
        img.alt = post.hero.alt || post.title || 'Bulletin hero image';
        figure.appendChild(img);
        heroWrapper.appendChild(figure);
        detailEl.appendChild(heroWrapper);
      }

      const bodySection = renderSection('Update');
      const body = document.createElement('div');
      body.className = 'bulletin-body bulletin-content';
      body.innerHTML = renderMarkdown(post.body);
      bodySection.appendChild(body);
      detailEl.appendChild(bodySection);

      if (Array.isArray(post.links) && post.links.length) {
        const linksSection = renderSection('Links');
        const list = document.createElement('ul');
        list.className = 'list-unstyled';
        post.links.forEach(item => {
          if (!item || !item.url) return;
          const li = document.createElement('li');
          const link = document.createElement('a');
          link.href = item.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = item.label || item.url;
          li.appendChild(link);
          list.appendChild(li);
        });
        linksSection.appendChild(list);
        detailEl.appendChild(linksSection);
      }

      const galleryItems = normalizeGalleryItems(post);
      if (galleryItems.length) {
        const gallerySection = renderSection('Gallery');
        gallerySection.classList.add('bulletin-gallery');
        const grid = document.createElement('div');
        grid.className = 'row g-4 bulletin-media';
        galleryItems.forEach(item => {
          if (!item || !(item.image || item.src)) return;
          const col = document.createElement('div');
          col.className = getGalleryColClass(item.layout);
          const figure = document.createElement('figure');
          const img = document.createElement('img');
          img.src = item.image || item.src;
          img.alt = item.alt || item.caption || post.title || 'Bulletin image';
          const caption = document.createElement('figcaption');
          caption.textContent = item.caption || '';
          figure.append(img, caption);
          col.appendChild(figure);
          grid.appendChild(col);
        });
        gallerySection.appendChild(grid);
        detailEl.appendChild(gallerySection);
      }

      if (post.video && post.video.url) {
        const videoSection = renderSection('Video');
        let embedUrl = null;

        if (post.video.type === 'youtube') {
          const id = getYouTubeId(post.video.url);
          if (id) embedUrl = `https://www.youtube.com/embed/${id}`;
        }

        if (post.video.type === 'vimeo') {
          const id = getVimeoId(post.video.url);
          if (id) embedUrl = `https://player.vimeo.com/video/${id}`;
        }

        if (embedUrl) {
          const ratio = document.createElement('div');
          ratio.className = 'ratio ratio-16x9';
          const iframe = document.createElement('iframe');
          iframe.src = embedUrl;
          iframe.title = 'Embedded video';
          iframe.allowFullscreen = true;
          ratio.appendChild(iframe);
          videoSection.appendChild(ratio);
        } else {
          const link = document.createElement('a');
          link.href = post.video.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = post.video.url;
          videoSection.appendChild(link);
        }

        detailEl.appendChild(videoSection);
      }

      if (Array.isArray(post.attachments) && post.attachments.length) {
        const attachmentsSection = renderSection('Attachments');
        const list = document.createElement('ul');
        list.className = 'list-unstyled';
        post.attachments.forEach(item => {
          if (!item || !item.url) return;
          const li = document.createElement('li');
          const link = document.createElement('a');
          link.href = item.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = item.label || item.url;
          li.appendChild(link);
          list.appendChild(li);
        });
        attachmentsSection.appendChild(list);
        detailEl.appendChild(attachmentsSection);
      }
    }

    const params = new URLSearchParams(window.location.search);
    const postId = params.get('id');
    const postSlug = normalizeSlug(params.get('slug'));

    if (!postId) {
      renderNotFound();
    } else {
      const previewMode = new URLSearchParams(window.location.search).get('preview') === '1';
      fetch('data/bulletin/posts.json', { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error('Unable to load bulletin data.');
          return response.json();
        })
        .then(data => {
          const posts = Array.isArray(data.posts) ? data.posts : [];
          const post = posts.find(item => {
            if (!(previewMode || item.status === 'published')) return false;
            if (postSlug) {
              return normalizeSlug(item.slug) === postSlug;
            }
            return item.id === postId;
          });
          if (!post) {
            renderNotFound();
            return;
          }
          renderDetail(post);
          if (previewMode && post.status === 'draft') {
            setStatus('Previewing draft (not published)', 'warning');
          }
        })
        .catch(() => {
          setStatus('We could not load the bulletin right now. Please try again later.', 'warning');
        });
    }
  </script>

  <script src="js/disclaimer.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body>
