backend:
  name: git-gateway
  branch: cms-netlify
  repo: HemanthNh/faros

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "bulletin"
    label: "Bulletin"
    files:
      - name: "posts"
        label: "Posts"
        file: "data/bulletin/posts.json"
        format: "json"
        fields:
          - name: "posts"
            label: "Posts"
            widget: "list"
            fields:
              - { name: "id", label: "ID", widget: "string" }
              - { name: "title", label: "Title", widget: "string" }
              - name: "date"
                label: "Date"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "DD-MM-YYYY"
                time_format: false
              - name: "status"
                label: "Status"
                widget: "select"
                options: ["draft", "published"]
                default: "draft"
              - name: "summary"
                label: "Summary"
                widget: "text"
                required: false
              - name: "body"
                label: "Body"
                widget: "markdown"
                buttons: ["bold", "italic", "heading-one", "heading-two", "quote", "code", "link", "bulleted-list", "numbered-list"]
                editor_components: ["image", "youtube", "vimeo"]
              - name: "links"
                label: "Links"
                widget: "list"
                required: false
                fields:
                  - { name: "label", label: "Label", widget: "string" }
                  - { name: "url", label: "URL", widget: "string" }
              - name: "images"
                label: "Images"
                widget: "list"
                required: false
                fields:
                  - { name: "src", label: "Image", widget: "image" }
                  - { name: "caption", label: "Caption", widget: "string" }
              - name: "video"
                label: "Video"
                widget: "object"
                required: false
                default: null
                fields:
                  - name: "type"
                    label: "Type"
                    widget: "select"
                    options: ["youtube", "vimeo"]
                    required: false
                  - name: "url"
                    label: "URL"
                    widget: "string"
                    required: false
              - name: "attachments"
                label: "Attachments"
                widget: "list"
                required: false
                fields:
                  - { name: "label", label: "Label", widget: "string" }
                  - { name: "url", label: "URL", widget: "string" }
