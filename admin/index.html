<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulletin Admin | Faros Legal</title>
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>
  <script>
    CMS.registerPreviewStyle('https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css');
    CMS.registerPreviewStyle('/css/theme.css');
    CMS.registerPreviewStyle('/css/style.css');

    (function() {
      const h = window.h || CMS.h;

      // Load marked for markdown preview
      const loadMarked = new Promise(resolve => {
        if (window.marked) return resolve();
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/marked/marked.min.js';
        script.onload = () => resolve();
        script.onerror = () => resolve();
        document.head.appendChild(script);
      });

      const renderMarkdown = text => {
        if (window.marked) return window.marked.parse(text || '');
        const safe = (text || '').replace(/[&<>]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]));
        return `<p>${safe}</p>`;
      };

      const PostDetailPreview = ({ entry }) => {
        const posts = entry.getIn(['data', 'posts'])?.toJS?.() || [];
        const post = posts[0] || {};

        const gallery = Array.isArray(post.gallery) ? post.gallery : [];
        const links = Array.isArray(post.links) ? post.links : [];
        const attachments = Array.isArray(post.attachments) ? post.attachments : [];

        return h('div', { className: 'container py-4 bulletin-body' },
          h('h2', { className: 'fw-semibold mb-2' }, post.title || 'Untitled bulletin'),
          h('div', { className: 'bulletin-meta mb-3' }, post.date || '—'),
          post.summary ? h('p', { className: 'text-muted' }, post.summary) : null,
          post.hero && post.hero.image ? h('figure', { className: 'bulletin-hero layout-contained mb-4' },
            h('img', { src: post.hero.image, alt: post.hero.alt || '' })
          ) : null,
          h('div', {
            className: 'bulletin-content mb-4',
            dangerouslySetInnerHTML: { __html: renderMarkdown(post.body || '') }
          }),
          links.length ? h('div', { className: 'mb-4' },
            h('h5', null, 'Links'),
            h('ul', null, links.map((item, idx) =>
              h('li', { key: idx },
                h('span', null, item.label || item.url || '')
              )
            ))
          ) : null,
          gallery.length ? h('div', { className: 'bulletin-gallery mb-4' },
            h('h5', null, 'Gallery'),
            h('div', { className: 'row g-3 bulletin-media' },
              gallery.map((item, idx) =>
                h('div', { className: 'col-12 col-md-6 col-lg-4', key: idx },
                  h('figure', null,
                    h('img', { src: item.image || item.src, alt: item.alt || '' }),
                    item.caption ? h('figcaption', null, item.caption) : null
                  )
                )
              )
            )
          ) : null,
          attachments.length ? h('div', { className: 'mb-3' },
            h('h5', null, 'Attachments'),
            h('ul', null, attachments.map((item, idx) =>
              h('li', { key: idx }, item.label || item.url || '')
            ))
          ) : null
        );
      };

      CMS.registerPreviewTemplate('posts', props => {
        const [ready, setReady] = React.useState(Boolean(window.marked));
        React.useEffect(() => { loadMarked.then(() => setReady(true)); }, []);
        return h(PostDetailPreview, props);
      });
    })();

    // Redirect to the admin once logged in through Netlify Identity
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    function escapeHtml(str) {
      return (str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Custom editor component for sized/aligned images
    CMS.registerEditorComponent({
      id: "image_sized",
      label: "Image (Sized)",
      fields: [
        { name: "image", label: "Image", widget: "image" },
        {
          name: "size",
          label: "Size",
          widget: "select",
          options: [
            { label: "Small", value: "img-sm" },
            { label: "Medium", value: "img-md" },
            { label: "Large", value: "img-lg" },
            { label: "Full", value: "img-full" }
          ]
        },
        {
          name: "align",
          label: "Alignment",
          widget: "select",
          options: [
            { label: "Left", value: "align-left" },
            { label: "Center", value: "align-center" },
            { label: "Right", value: "align-right" }
          ]
        },
        { name: "alt", label: "Alt text", widget: "string", required: false }
      ],
      pattern: /^<figure class="img-wrap (align-(?:left|center|right))">\s*<img src="([^"]+)" class="(img-(?:sm|md|lg|full))" alt="([^"]*)" ?\/?>\s*<\/figure>$/i,
      fromBlock: function(match) {
        return {
          align: match[1],
          image: match[2],
          size: match[3],
          alt: match[4] || ""
        };
      },
      toBlock: function(obj) {
        const src = obj.image || "";
        const size = obj.size || "img-md";
        const align = obj.align || "align-left";
        const alt = escapeHtml(obj.alt);
        return `<figure class="img-wrap ${align}">\n  <img src="${src}" class="${size}" alt="${alt}" />\n</figure>`;
      },
      toPreview: function(obj) {
        const src = obj.image || "";
        const size = obj.size || "img-md";
        const align = obj.align || "align-left";
        const alt = escapeHtml(obj.alt);
        return `<figure class="img-wrap ${align}">\n  <img src="${src}" class="${size}" alt="${alt}" />\n</figure>`;
      }
    });
  </script>
</body>
</html>
