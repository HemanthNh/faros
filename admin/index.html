<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulletin Admin | Faros Legal</title>
  <style>
    /* Hide Netlify callout if rendered in the same document */
    .netlify-identity-widget a.callOut,
    .netlify-identity-widget .callOut,
    a.callOut[href*="netlify.com"] {
      display: none !important;
    }
  </style>
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>
  <script>
    // Redirect to the admin once logged in through Netlify Identity
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    function escapeHtml(str) {
      return (str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Custom editor component for sized/aligned images
    CMS.registerEditorComponent({
      id: "image_sized",
      label: "Image (Sized)",
      fields: [
        { name: "image", label: "Image", widget: "image" },
        {
          name: "size",
          label: "Size",
          widget: "select",
          options: [
            { label: "Small", value: "img-sm" },
            { label: "Medium", value: "img-md" },
            { label: "Large", value: "img-lg" },
            { label: "Full", value: "img-full" }
          ]
        },
        {
          name: "align",
          label: "Alignment",
          widget: "select",
          options: [
            { label: "Left", value: "align-left" },
            { label: "Center", value: "align-center" },
            { label: "Right", value: "align-right" }
          ]
        },
        { name: "alt", label: "Alt text", widget: "string", required: false }
      ],
      pattern: /^<figure class="img-wrap (align-(?:left|center|right))">\s*<img src="([^"]+)" class="(img-(?:sm|md|lg|full))" alt="([^"]*)" ?\/?>\s*<\/figure>$/i,
      fromBlock: function(match) {
        return {
          align: match[1],
          image: match[2],
          size: match[3],
          alt: match[4] || ""
        };
      },
      toBlock: function(obj) {
        const src = obj.image || "";
        const size = obj.size || "img-md";
        const align = obj.align || "align-left";
        const alt = escapeHtml(obj.alt);
        return `<figure class="img-wrap ${align}">\n  <img src="${src}" class="${size}" alt="${alt}" />\n</figure>`;
      },
      toPreview: function(obj) {
        const src = obj.image || "";
        const size = obj.size || "img-md";
        const align = obj.align || "align-left";
        const alt = escapeHtml(obj.alt);
        return `<figure class="img-wrap ${align}">\n  <img src="${src}" class="${size}" alt="${alt}" />\n</figure>`;
      }
    });

    // Add a drafts link into the CMS header so drafts are accessible only from admin
    (function addDraftsShortcut() {
      const LINK_ID = 'drafts-shortcut-link';

      function findNavList() {
        return (
          document.querySelector('.nc-app-header nav ul') ||
          document.querySelector('header[class*="AppHeader"] nav ul') ||
          document.querySelector('.nc-app-header ul') ||
          document.querySelector('header[class*="AppHeader"] ul')
        );
      }

      function ensureLink() {
        if (document.getElementById(LINK_ID)) return;
        const navList = findNavList();
        if (!navList) return;
        const item = document.createElement('li');
        item.id = LINK_ID;
        item.style.listStyle = 'none';
        item.style.display = 'inline-flex';
        item.style.alignItems = 'center';
        item.style.marginLeft = '16px';
        const link = document.createElement('a');
        link.href = '/bulletin-drafts.html';
        link.className = 'nc-nav-link';
        link.textContent = 'View drafts';
        link.style.display = 'inline-flex';
        link.style.alignItems = 'center';
        link.style.gap = '6px';
        const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        icon.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        icon.setAttribute('viewBox', '0 0 24 24');
        icon.setAttribute('width', '16');
        icon.setAttribute('height', '16');
        icon.setAttribute('fill', 'none');
        icon.setAttribute('stroke', '#295f9e');
        icon.setAttribute('stroke-width', '2');
        icon.setAttribute('stroke-linecap', 'round');
        icon.setAttribute('stroke-linejoin', 'round');
        icon.innerHTML = '<path d="M4 4h9l5 5v11H4z"/><path d="M13 4v5h5"/><path d="M9 13h6m-6 4h6"/>';
        link.prepend(icon);
        item.appendChild(link);
        navList.appendChild(item);
      }

      const observer = new MutationObserver(() => ensureLink());
      observer.observe(document.body, { childList: true, subtree: true });
      // Try immediately in case the header is already there
      ensureLink();
      // Stop observing after 15s to avoid leaks
      setTimeout(() => observer.disconnect(), 15000);
    })();

    // Rename Netlify Identity login button text
    (function renameIdentityCTA() {
      const targetText = /netlify identity/i;
      const replacement = 'Log in';

      function updateLabels() {
        document.querySelectorAll('button, a').forEach(el => {
          if (!el || !el.textContent) return;
          if (targetText.test(el.textContent)) {
            el.textContent = replacement;
          }
        });
      }

      const observer = new MutationObserver(updateLabels);
      observer.observe(document.body, { childList: true, subtree: true });
      updateLabels();
      setTimeout(() => observer.disconnect(), 15000);
    })();

    // Replace Netlify callout logo/text in Identity widget
    (function hideNetlifyCallout() {
      function hideInDoc(doc) {
        if (!doc) return;
        doc.querySelectorAll('a.callOut[href*="netlify.com"], .callOut').forEach(el => {
          el.style.setProperty('display', 'none', 'important');
          el.style.setProperty('visibility', 'hidden', 'important');
          el.style.setProperty('pointer-events', 'none', 'important');
        });
      }

      function hideAll() {
        hideInDoc(document);
        document.querySelectorAll('iframe').forEach(frame => {
          try {
            hideInDoc(frame.contentDocument || frame.contentWindow?.document);
          } catch (e) {
            /* ignore cross-origin if any */
          }
        });
      }

      const observer = new MutationObserver(hideAll);
      observer.observe(document.body, { childList: true, subtree: true });
      hideAll();
      setTimeout(() => observer.disconnect(), 20000);
    })();

    // Replace Decap logo with Faros branding
    (function replaceDecapLogo() {
      const LOGO_ID = 'faros-admin-logo';
      const imgSrc = '/images/Faros_Logo.jpeg';

      function createLogoNode() {
        const wrapper = document.createElement('span');
        wrapper.id = LOGO_ID;
        wrapper.style.display = 'inline-flex';
        wrapper.style.alignItems = 'center';
        wrapper.style.gap = '8px';

        const img = document.createElement('img');
        img.src = imgSrc;
        img.alt = 'Faros Admin';
        img.style.height = '32px';
        img.style.width = 'auto';
        img.style.display = 'block';
        img.style.borderRadius = '4px';

        const label = document.createElement('span');
        label.textContent = 'Faros Admin';
        label.style.fontWeight = '600';
        label.style.color = '#1f2937';
        label.style.fontSize = '15px';

        wrapper.appendChild(img);
        wrapper.appendChild(label);
        return wrapper;
      }

      function applyLogo() {
        if (document.getElementById(LOGO_ID)) return;
        const decapLogo = document.querySelector('[class*="DecapLogoIcon"]');
        if (decapLogo) {
          decapLogo.replaceWith(createLogoNode());
          return;
        }
        const container =
          document.querySelector('.nc-app-header a[class*="Logo"]') ||
          document.querySelector('.nc-app-header a[href="/"]') ||
          document.querySelector('header[class*="AppHeader"] a[class*="Logo"]') ||
          document.querySelector('header[class*="AppHeader"] a[href="/"]');
        if (container) {
          const node = createLogoNode();
          container.innerHTML = '';
          container.style.display = 'inline-flex';
          container.style.alignItems = 'center';
          container.style.gap = '8px';
          container.style.textDecoration = 'none';
          container.appendChild(node);
        }
      }

      const observer = new MutationObserver(applyLogo);
      observer.observe(document.body, { childList: true, subtree: true });
      applyLogo();
      setTimeout(() => observer.disconnect(), 15000);
    })();

    // Confirm before deleting list items (e.g., posts) in the CMS UI
    (function addDeleteConfirmation() {
      function shouldConfirm(target) {
        const btn = target.closest('button, a');
        if (!btn) return false;
        const cls = (btn.className || '').toLowerCase();
        const label = (btn.getAttribute('aria-label') || btn.textContent || '').toLowerCase();
        return (
          cls.includes('nc-arraycontrol-remove') ||
          cls.includes('nc-arraycontrol-delete') ||
          cls.includes('nc-array-control-remove') ||
          label.includes('delete') ||
          label.includes('remove')
        );
      }

      document.addEventListener('click', event => {
        if (!shouldConfirm(event.target)) return;
        const ok = window.confirm('Remove this item? This will delete it from the entry.');
        if (!ok) {
          event.stopPropagation();
          event.preventDefault();
        }
      }, true);
    })();
  </script>
</body>
</html>
