<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulletin Admin | Faros Legal</title>
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>
  <script>
    CMS.registerPreviewStyle('https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css');
    CMS.registerPreviewStyle('/css/theme.css');
    CMS.registerPreviewStyle('/css/style.css');

    (function() {
      const h = window.h || CMS.h;

      const PostPreview = ({ entry }) => {
        const posts = entry.getIn(['data', 'posts'])?.toJS?.() || [];
        if (!posts.length) {
          return h('div', { className: 'container py-4' },
            h('h2', { className: 'fw-semibold mb-3' }, 'Bulletin Preview'),
            h('p', { className: 'text-muted' }, 'No posts to preview yet.')
          );
        }

        return h('div', { className: 'container py-4' },
          h('h2', { className: 'fw-semibold mb-3' }, 'Bulletin Preview'),
          h('div', { className: 'row g-4' },
            posts.map((post, idx) => {
              const summary = post.summary || (post.body ? `${post.body.slice(0, 200)}...` : '');
              return h('div', { className: 'col-md-6 col-lg-4', key: idx },
                h('div', { className: 'bulletin-card p-4 h-100' },
                  h('small', { className: 'bulletin-meta' }, post.date || '—'),
                  h('h5', { className: 'mt-2' }, post.title || 'Untitled bulletin'),
                  h('p', { className: 'mb-3' }, summary || 'No summary provided.'),
                  h('span', { className: 'text-primary fw-semibold' }, 'Read full bulletin')
                )
              );
            })
          )
        );
      };

      CMS.registerPreviewTemplate('posts', PostPreview);
    })();

    // Redirect to the admin once logged in through Netlify Identity
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    function escapeHtml(str) {
      return (str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Custom editor component for sized/aligned images
    CMS.registerEditorComponent({
      id: "image_sized",
      label: "Image (Sized)",
      fields: [
        { name: "image", label: "Image", widget: "image" },
        {
          name: "size",
          label: "Size",
          widget: "select",
          options: [
            { label: "Small", value: "img-sm" },
            { label: "Medium", value: "img-md" },
            { label: "Large", value: "img-lg" },
            { label: "Full", value: "img-full" }
          ]
        },
        {
          name: "align",
          label: "Alignment",
          widget: "select",
          options: [
            { label: "Left", value: "align-left" },
            { label: "Center", value: "align-center" },
            { label: "Right", value: "align-right" }
          ]
        },
        { name: "alt", label: "Alt text", widget: "string", required: false }
      ],
      pattern: /^<figure class="img-wrap (align-(?:left|center|right))">\s*<img src="([^"]+)" class="(img-(?:sm|md|lg|full))" alt="([^"]*)" ?\/?>\s*<\/figure>$/i,
      fromBlock: function(match) {
        return {
          align: match[1],
          image: match[2],
          size: match[3],
          alt: match[4] || ""
        };
      },
      toBlock: function(obj) {
        const src = obj.image || "";
        const size = obj.size || "img-md";
        const align = obj.align || "align-left";
        const alt = escapeHtml(obj.alt);
        return `<figure class="img-wrap ${align}">\n  <img src="${src}" class="${size}" alt="${alt}" />\n</figure>`;
      },
      toPreview: function(obj) {
        const src = obj.image || "";
        const size = obj.size || "img-md";
        const align = obj.align || "align-left";
        const alt = escapeHtml(obj.alt);
        return `<figure class="img-wrap ${align}">\n  <img src="${src}" class="${size}" alt="${alt}" />\n</figure>`;
      }
    });
  </script>
</body>
</html>
