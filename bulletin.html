<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/lucide-static@latest/font/lucide.css" rel="stylesheet">

  <link href="css/theme.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-black py-3">
    <div class="container">
      <a class="navbar-brand fw-bold text-white" href="index.html">
        <img src="images/Faros_Logo.jpeg" alt="Faros Legal">
        <span>Faros Legal</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="practice-areas.html">Practice Areas</a></li>
          <!-- <li class="nav-item"><a class="nav-link" href="insights.html">Insights & Highlights</a></li> -->
          <li class="nav-item"><a class="nav-link active" href="bulletin.html">Bulletin</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="flex-grow-1">
    <section class="py-5 text-center" style="background: var(--bg-section);">
      <div class="container">
        <h1 class="fw-semibold">Bulletin</h1>
        <p class="text-muted mb-0">Legal updates, firm announcements, and client-ready guidance.</p>
      </div>
    </section>

    <section class="py-5">
      <div class="container">
        <div id="bulletin-status" class="alert alert-info" style="display: none;"></div>
        <div id="bulletin-list" class="row g-4"></div>
        <div id="bulletin-pagination" class="d-flex justify-content-center mt-4"></div>
      </div>
    </section>
  </main>

  <footer class="bg-black text-white text-center py-3 mt-auto">
    <small>&copy; 2025 Faros Legal | Bengaluru, India</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script>
    const listEl = document.getElementById('bulletin-list');
    const statusEl = document.getElementById('bulletin-status');
    const paginationEl = document.getElementById('bulletin-pagination');
    const allowedIframeHosts = ['youtube.com', 'www.youtube.com', 'youtu.be', 'vimeo.com', 'player.vimeo.com'];
    const pageSize = 6;
    let currentPage = 1;
    let currentPosts = [];

    function isAllowedEmbed(src) {
      try {
        const url = new URL(src, window.location.href);
        return allowedIframeHosts.some(host => url.hostname === host || url.hostname.endsWith(`.${host}`));
      } catch (err) {
        return false;
      }
    }

    DOMPurify.addHook('uponSanitizeElement', (node, data) => {
      if (data.tagName === 'iframe') {
        const src = node.getAttribute('src') || '';
        if (!isAllowedEmbed(src)) {
          if (node.parentNode) node.parentNode.removeChild(node);
        } else {
          node.setAttribute('referrerpolicy', 'no-referrer');
          node.setAttribute('allowfullscreen', 'true');
        }
      }
    });

    function renderMarkdown(md) {
      return DOMPurify.sanitize(marked.parse(md || ''), {
        ADD_TAGS: ['iframe'],
        ADD_ATTR: ['allow', 'allowfullscreen', 'frameborder', 'src', 'width', 'height', 'referrerpolicy'],
      });
    }

    function renderPlainText(md) {
      const html = marked.parse(md || '');
      const clean = DOMPurify.sanitize(html, { ALLOWED_TAGS: [], ALLOWED_ATTR: [] });
      return clean.replace(/\s+/g, ' ').trim();
    }

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = `alert alert-${type}`;
      statusEl.style.display = 'block';
    }

    function normalizeSlug(value) {
      return (value || '').toString().trim().toLowerCase();
    }

    function clearList() {
      while (listEl.firstChild) {
        listEl.removeChild(listEl.firstChild);
      }
    }

    function clearPagination() {
      while (paginationEl.firstChild) {
        paginationEl.removeChild(paginationEl.firstChild);
      }
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      const dd = String(date.getDate()).padStart(2, '0');
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const yyyy = date.getFullYear();
      return `${dd}-${mm}-${yyyy}`;
    }

    function renderPosts(posts) {
      clearList();
      if (!posts.length) {
        setStatus('No published bulletins yet. Please check back soon.', 'light');
        clearPagination();
        return;
      }
      statusEl.style.display = 'none';
      posts.forEach(post => {
        const col = document.createElement('div');
        col.className = 'col-md-6 col-lg-4';

        const card = document.createElement('div');
        card.className = 'bulletin-card p-4 h-100';

        const meta = document.createElement('small');
        meta.className = 'bulletin-meta d-inline-flex align-items-center gap-1';
        const dateIcon = document.createElement('i');
        dateIcon.setAttribute('data-lucide', 'calendar');
        dateIcon.className = 'text-secondary';
        dateIcon.setAttribute('aria-hidden', 'true');
        const dateText = document.createElement('span');
        dateText.textContent = formatDate(post.date);
        meta.append(dateIcon, dateText);

        const heading = document.createElement('div');
        heading.className = 'd-flex align-items-center gap-2 mb-2';
        const icon = document.createElement('i');
        icon.setAttribute('data-lucide', 'newspaper');
        icon.className = 'text-primary';
        icon.setAttribute('aria-hidden', 'true');

        const title = document.createElement('h5');
        title.className = 'mt-2';
        title.textContent = post.title || 'Untitled bulletin';
        heading.append(icon, title);

        const summary = document.createElement('p');
        summary.className = 'mb-3 mt-1';
        const summarySource = post.summary || (post.body ? `${post.body.slice(0, 240)}...` : '');
        summary.textContent = renderPlainText(summarySource);

        const link = document.createElement('a');
        const slug = normalizeSlug(post.slug);
        const target = slug ? `bulletin-view.html?post=${encodeURIComponent(slug)}` : `bulletin-view.html?id=${encodeURIComponent(post.id)}`;
        link.href = target;
        link.className = 'stretched-link text-primary';
        link.classList.add('d-inline-flex', 'align-items-center', 'gap-2');
        const linkText = document.createElement('span');
        linkText.textContent = 'Read full bulletin';
        const linkIcon = document.createElement('i');
        linkIcon.setAttribute('data-lucide', 'arrow-right');
        linkIcon.setAttribute('aria-hidden', 'true');
        link.append(linkText, linkIcon);

        card.append(meta, heading, summary, link);
        col.appendChild(card);
        listEl.appendChild(col);
      });

      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    function renderPagination(totalPages) {
      clearPagination();
      if (totalPages <= 1) return;

      const nav = document.createElement('nav');
      nav.setAttribute('aria-label', 'Bulletin pagination');
      const list = document.createElement('ul');
      list.className = 'pagination';

      const addItem = (label, page, disabled, active) => {
        const li = document.createElement('li');
        li.className = `page-item${disabled ? ' disabled' : ''}${active ? ' active' : ''}`;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'page-link';
        btn.textContent = label;
        if (!disabled) {
          btn.addEventListener('click', () => {
            renderPage(page);
          });
        }
        li.appendChild(btn);
        list.appendChild(li);
      };

      addItem('Previous', currentPage - 1, currentPage === 1, false);
      for (let page = 1; page <= totalPages; page += 1) {
        addItem(page, page, false, page === currentPage);
      }
      addItem('Next', currentPage + 1, currentPage === totalPages, false);

      nav.appendChild(list);
      paginationEl.appendChild(nav);
    }

    function renderPage(page) {
      if (!currentPosts.length) {
        renderPosts([]);
        return;
      }
      const totalPages = Math.ceil(currentPosts.length / pageSize);
      currentPage = Math.min(Math.max(page, 1), totalPages);
      const start = (currentPage - 1) * pageSize;
      const slice = currentPosts.slice(start, start + pageSize);
      renderPosts(slice);
      renderPagination(totalPages);
    }

    fetch('data/bulletin/posts.json', { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('Unable to load bulletin data.');
        return response.json();
      })
      .then(data => {
        const posts = Array.isArray(data.posts) ? data.posts : [];
        const published = posts.filter(post => post.status === 'published');
        published.sort((a, b) => new Date(b.date) - new Date(a.date));
        currentPosts = published;
        renderPage(1);
      })
      .catch(() => {
        setStatus('We could not load the bulletin right now. Please try again later.', 'warning');
      });
  </script>

  <script src="js/disclaimer.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>
</body>
